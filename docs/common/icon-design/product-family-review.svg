<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1180" viewBox="0 0 1080 1180" role="img" aria-label="PolyQuota and GraphAgent final icon family design">
  <title>PolyQuota × GraphAgent · Final</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <path d="M0 0H8V8H0ZM8 8H16V16H8Z" fill="#F0F3F8"/>
    </pattern>
    <symbol id="polyquotaCore" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <circle cx="32" cy="28.5" r="22.8"/>
        <path d="M32 5.7V18.5M12.255 39.9 22 34.274M51.745 39.9 42 34.274"/>
      </g>
      <g fill="currentColor">
        <circle cx="32" cy="5.7" r="5.4"/>
        <circle cx="12.255" cy="39.9" r="5.4"/>
        <circle cx="51.745" cy="39.9" r="5.4"/>
        <path fill-rule="evenodd" d="M26 18.5H38Q42 18.5 42 22.5V34.5Q42 38.5 38 38.5H26Q22 38.5 22 34.5V22.5Q22 18.5 26 18.5ZM26.7 22.7H37.3Q38 22.7 38 23.4V24.4Q38 25.1 37.3 25.1H26.7Q26 25.1 26 24.4V23.4Q26 22.7 26.7 22.7ZM26.7 27.3H37.3Q38 27.3 38 28V29Q38 29.7 37.3 29.7H26.7Q26 29.7 26 29V28Q26 27.3 26.7 27.3ZM26.7 31.9H37.3Q38 31.9 38 32.6V33.6Q38 34.3 37.3 34.3H26.7Q26 34.3 26 33.6V32.6Q26 31.9 26.7 31.9Z"/>
      </g>
    </symbol>
    <symbol id="polyquota" viewBox="0 0 64 64">
      <use href="#polyquotaCore"/>
      <rect x="14" y="57.2" width="21.6" height="2.8" rx="1.4" fill="currentColor"/>
      <rect x="14" y="57.2" width="36" height="2.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1"/>
    </symbol>
    <symbol id="polyquotaGreen" viewBox="0 0 64 64">
      <use href="#polyquotaCore" color="#164BDD"/>
      <rect x="14" y="57.2" width="21.6" height="2.8" rx="1.4" fill="#168C4B"/>
      <rect x="14" y="57.2" width="36" height="2.8" rx="1.4" fill="none" stroke="#168C4B" stroke-width="1"/>
    </symbol>
    <symbol id="polyquotaOrange" viewBox="0 0 64 64">
      <use href="#polyquotaCore" color="#164BDD"/>
      <rect x="14" y="57.2" width="14.4" height="2.8" rx="1.4" fill="#D97908"/>
      <rect x="14" y="57.2" width="36" height="2.8" rx="1.4" fill="none" stroke="#D97908" stroke-width="1"/>
    </symbol>
    <symbol id="polyquotaRed" viewBox="0 0 64 64">
      <use href="#polyquotaCore" color="#164BDD"/>
      <rect x="14" y="57.2" width="7.2" height="2.8" rx="1.4" fill="#DA304B"/>
      <rect x="14" y="57.2" width="36" height="2.8" rx="1.4" fill="none" stroke="#DA304B" stroke-width="1"/>
    </symbol>
    <symbol id="graphagent" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M43.64 52.48 10.65 37.42 34.97 8.6 53.34 29.5 48.49 40.99"/>
      </g>
      <g fill="currentColor">
        <circle cx="34.97" cy="8.6" r="5.2"/>
        <circle cx="53.34" cy="29.5" r="5.2"/>
        <circle cx="43.64" cy="52.48" r="5.2"/>
        <circle cx="10.65" cy="37.42" r="5.2"/>
        <path d="M35.65 24.5C36.3 28.8 38.85 31.35 43.15 32C38.85 32.65 36.3 35.2 35.65 39.5C35 35.2 32.45 32.65 28.15 32C32.45 31.35 35 28.8 35.65 24.5Z"/>
      </g>
    </symbol>
    <symbol id="graphConstruction" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34.97 8.6 53.34 29.5 43.64 52.48 10.65 37.42Z"/>
        <path d="M34.97 8.6 43.64 52.48"/>
        <path d="M10.65 37.42 53.34 29.5" stroke-dasharray="2 1.8" opacity=".45"/>
      </g>
      <g fill="none" stroke="#B79AEE" stroke-width=".8" stroke-linecap="round" stroke-dasharray="1.2 1.5">
