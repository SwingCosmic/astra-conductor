appId: io.astraconductor.polyquota
productName: PolyQuota
asar: true
npmRebuild: false
directories:
  output: release
files:
  - package.json
  - dist/**
  - "!dist/protocol-*"
  - renderer/**
  - "!node_modules/better-sqlite3/build/**"
extraResources:
  - from: lib/better-sqlite3
    to: lib/better-sqlite3
  - from: assets/icons
    to: icons
win:
  icon: assets/icons/polyquota.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: assets/icons/polyquota.ico
  uninstallerIcon: assets/icons/polyquota.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 已有安装锁定原作用域与位置，清理跨作用域残留，见 build/installer.nsh
  include: build/installer.nsh
  artifactName: ${productName}-${version}-setup.${ext}
