<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>GraphAgent</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/graphagent.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <img class="mark" src="../assets/icons/graphagent.svg" alt="" />
        <strong>GraphAgent</strong>
      </div>
      <nav>
        <button id="home-tab" class="selected">主页</button><button id="settings-tab">设置</button>
      </nav>
      <small>ASTRA CONDUCTOR</small>
    </aside>
    <main>
      <section id="home" aria-label="主页"></section>
      <section id="settings" hidden>
        <header>
          <div>
            <p class="eyebrow">SETTINGS</p>
            <h1>设置</h1>
            <p class="muted">管理共享凭据与本机服务。</p>
          </div>
          <button id="check">重新检查</button>
        </header>
        <div id="notice" role="status" hidden></div>
        <article>
          <div class="section-heading">
            <h2>凭据共享服务</h2>
            <span id="install-badge" class="badge">检查中</span>
          </div>
          <p id="compatibility-hint" role="status" hidden>
            当前凭据共享服务不满足应用要求，请先安装支持所需 API 的组件，再验证或连接共享凭据。
          </p>
          <dl id="component-info"></dl>
          <p class="muted">自动下载尚未开放。请先将完整本地组件包放入下方目录，再安装。</p>
          <code id="package-directory"></code>
          <div class="actions">
            <button id="install" class="primary">安装本地组件</button
            ><button id="uninstall">卸载组件</button>
          </div>
        </article>
        <article>
          <div class="section-heading">
            <h2>共享凭据</h2>
            <span id="sharing-badge" class="badge">尚未导入</span>
          </div>
          <p id="sharing-hint" class="muted">
            从 PolyQuota 导出的目录导入凭据。密钥仅用于本次验证。
          </p>
          <dl id="sharing-info"></dl>
          <div id="import-form">
            <label>共享目录</label>
            <div class="directory">
              <input id="directory" readonly placeholder="选择已有共享目录" /><button id="choose">
                选择目录
              </button>
            </div>
            <label for="migration-key">迁移密钥</label
            ><input
              id="migration-key"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="输入 PolyQuota 交付的迁移密钥"
            />
            <div class="actions"><button id="verify" class="primary">验证并预览</button></div>
          </div>
          <div id="preview" hidden>
            <h3>确认导入</h3>
            <p class="muted">已完成解密与完整性校验。确认后在本机安全记住主密钥。</p>
            <div id="preview-accounts"></div>
            <div class="actions">
              <button id="confirm" class="primary">确认导入</button
              ><button id="cancel">取消</button>
            </div>
          </div>
          <div id="connected" hidden>
            <div class="actions">
              <button id="retry">重新连接 / 重试</button
              ><button id="revalidate">重新验证迁移密钥</button>
            </div>
            <div id="accounts"></div>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
